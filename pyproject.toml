[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-tp"
dynamic = ["version"]
description = "Personal infrastructure substrate for Windows and Linux with capability discovery, durable jobs, and optional compute and transport cartridges."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "uyenthudao2410-code", email = "uyenthu.dao2410@gmail.com" },
]
keywords = [
  "networking",
  "transport-protocol",
  "rlnc",
  "fountain-codes",
  "gf256",
  "polymorphic-networking",
  "windows",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
aether = ["cryptography", "imageio-ffmpeg", "openpyxl", "Pillow"]

[project.scripts]
chimera-tp = "chimera_tp.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "chimera_tp.__version__"}

[tool.setuptools.packages.find]
include = ["chimera_tp*"]

[tool.setuptools.package-data]
chimera_tp = ["_chimera_core.dll", "_chimera_core.so"]

[tool.setuptools.exclude-package-data]
"*" = ["*.prev", "*.pdb", "*.lib", "*.exp"]
